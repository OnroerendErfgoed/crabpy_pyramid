name: crabpy_pyramid

on:
  pull_request:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/crabpy_pyramid.yml'

  push:
    branches:
      - master

permissions: {}

jobs:
  build:
    uses: OnroerendErfgoed/shared-workflows/.github/workflows/python-tests.yml@v1
    permissions:
      contents: read
      pull-requests: write # coverage comment
    with:
      installer: uv
      lint-command: "" # the old workflow ran no linter
      test-command: pytest --cov crabpy_pyramid --cov-report term-missing --cov-report xml:"$COVERAGE_XML" tests