name: crabpy_pyramid tests

on:
  pull_request:
    paths:
      - crabpy_pyramid/**
      - tests/**
      - .github/workflows/backend.yaml
      - pyproject.toml
      - uv.lock

  push:
    branches:
      - master

env:
  CRABPY_INTEGRATION_TESTS: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install python requirements
        run: |
          uv sync --locked -p ${{ matrix.python-version }}

      - name: Python tests
        run: |
          uv run --no-sync flake8
          uv run --no-sync pytest tests --cov=crabpy_pyramid --cov-report=xml

      - name: Code Coverage Report
        if: matrix.python-version == '3.11'
        uses: orgoro/coverage@v3.2
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.8
          thresholdModified: 0.8
